<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffd34e" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>"
    />
    <title>Danya's Games</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: linear-gradient(180deg, #fff7e6, #ffe9c7);
        color: #2b2b2b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .hub {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(16px, 4vh, 40px);
        padding: 24px;
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 7vw, 64px);
        color: #ff9f1c;
        text-shadow: 0 3px 0 #fff;
        text-align: center;
      }
      .games {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: clamp(14px, 3vw, 32px);
      }
      .game-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: clamp(160px, 36vw, 260px);
        aspect-ratio: 1;
        background: #fff;
        border-radius: 28px;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12);
        text-decoration: none;
        color: #2b2b2b;
        transition: transform 0.08s ease;
      }
      .game-card:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
      }
      .game-emoji {
        font-size: clamp(56px, 12vw, 110px);
        line-height: 1;
      }
      .game-name {
        font-size: clamp(18px, 3.4vw, 30px);
        font-weight: 800;
      }
      footer {
        font-size: 14px;
        opacity: 0.55;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="hub">
      <h1>🎈 Danya's Games 🎈</h1>
      <nav class="games">
        <a class="game-card" href="./coloring/">
          <span class="game-emoji">🎨</span>
          <span class="game-name">Coloring</span>
        </a>
        <a class="game-card" href="./dressup/">
          <span class="game-emoji">👗</span>
          <span class="game-name">Dress Up</span>
        </a>
      </nav>
      <footer>No ads · No tracking · Just play</footer>
    </div>
  </body>
</html>
